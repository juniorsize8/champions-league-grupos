<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions League — Fase de Grupos</title>
<style>
  :root{
    --bg:#0b1220; --bg-elev:#111a2b; --bg-elev-2:#0f1830;
    --border:#223047; --text:#eef2f8; --text-dim:#8ea0b8;
    --accent:#22c55e; --accent-dim:#0f2a1a;
    --warn:#eab308; --warn-dim:#2a2410;
    --danger:#ef4444; --danger-dim:#2a1414;
    --info:#3b82f6; --info-dim:#12203f;
    --chip-off:#28374d;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif;}
  #app{max-width:1100px; margin:0 auto; padding:16px; padding-bottom:48px;}

  header.top{display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap;}
  header.top .emoji{font-size:28px;}
  header.top h1{font-size:19px; margin:0;}
  header.top p{font-size:12px; color:var(--text-dim); margin:2px 0 0;}
  header.top .progress{margin-left:auto; font-size:12px; color:var(--text-dim); text-align:right;}
  header.top .progress b{color:var(--text); font-size:14px;}

  nav.tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  nav.tabs button{background:var(--bg-elev); color:var(--text-dim); border:1px solid var(--border); border-radius:999px; padding:7px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  nav.tabs button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .rules-note{font-size:11.5px; color:var(--text-dim); background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px; margin-bottom:16px;}

  .chip-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:8px; margin-bottom:18px;}
  @media (max-width:620px){ .chip-grid{grid-template-columns:repeat(4,1fr);} }
  .chip{position:relative; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:12px 0; text-align:center; font-weight:700; font-size:15px; cursor:pointer; color:var(--text);}
  .chip.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  .chip .dot{position:absolute; top:6px; right:8px; width:8px; height:8px; border-radius:50%;}
  .dot-green{background:var(--accent);} .dot-yellow{background:var(--warn);} .dot-gray{background:var(--chip-off);}
  .legend{display:flex; gap:16px; font-size:11.5px; color:var(--text-dim); margin:-8px 0 20px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .card{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:16px;}
  .card h2{font-size:15px; margin:0 0 10px;}
  .card h2 .sub{font-weight:400; color:var(--text-dim); font-size:12px; float:right;}

  table.standings{width:100%; border-collapse:collapse; font-size:13px;}
  table.standings th{text-align:left; color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase; padding:6px 6px; border-bottom:1px solid var(--border);}
  table.standings td{padding:7px 6px; border-bottom:1px solid var(--border);}
  table.standings td.num, table.standings th.num{text-align:center;}
  table.standings tr:last-child td{border-bottom:none;}
  .pos-badge{display:inline-block; width:18px; height:18px; line-height:18px; border-radius:50%; background:var(--bg-elev-2); text-align:center; font-size:11px; font-weight:700; margin-right:6px;}
  .pos-1, .pos-2{background:var(--accent-dim); color:var(--accent);}

  .match-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 4px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .match-row:last-child{border-bottom:none;}
  .match-summary{display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1 1 200px; min-width:0;}
  .match-summary .name{font-size:13px; font-weight:600; color:var(--text-dim); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .match-summary .name.win{color:var(--text); font-weight:700;}
  .score-pair{font-size:14px; font-weight:700; color:var(--text); flex:0 0 auto;}
  .vs-tag{font-size:12px; color:var(--text-dim); flex:0 0 auto;}
  .match-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .match-row .pts-preview{font-size:10.5px; color:var(--text-dim);}
  .match-row .tb-tag{font-size:10px; font-weight:700; color:var(--warn); background:var(--warn-dim); border-radius:6px; padding:2px 6px;}
  .match-row .cancel-tag{font-size:10px; font-weight:700; color:var(--danger); background:var(--danger-dim); border-radius:6px; padding:2px 6px;}
  .edit-btn{border:1px solid var(--border); background:var(--bg-elev-2); color:var(--text); border-radius:6px; padding:6px 12px; font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
  @media (max-width:420px){
    .match-summary .name{font-size:12px;}
  }

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100;}
  .modal-box{background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; padding:20px; width:100%; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .modal-header h3{margin:0; font-size:16px;}
  .modal-x{background:none; border:none; color:var(--text-dim); font-size:20px; line-height:1; cursor:pointer; padding:0 4px;}
  .modal-players{text-align:center; font-size:14px; margin-bottom:14px;}
  .modal-players .vs{color:var(--text-dim); font-size:12px; margin:0 6px;}
  .modal-scores{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:12px;}
  .modal-score{width:64px; text-align:center; padding:10px 4px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:20px; font-weight:700;}
  .modal-scores .dash{color:var(--text-dim); font-size:16px;}
  .modal-preview{text-align:center; font-size:11.5px; color:var(--text-dim); min-height:16px; margin-bottom:14px;}
  .modal-actions{display:flex; gap:8px; margin-bottom:12px;}
  .modal-actions button{flex:1; border-radius:8px; padding:9px 6px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--border);}
  .btn-secondary{background:var(--bg-elev-2); color:var(--text);}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent) !important;}
  .btn-primary[disabled]{opacity:.4; cursor:default;}
  .modal-cancel-toggle{display:block; width:100%; text-align:center; background:none; border:none; color:var(--text-dim); font-size:11.5px; text-decoration:underline; cursor:pointer; padding:4px;}

  .overview-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .ov-card{background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .ov-card .hd{background:var(--info); color:#fff; font-weight:700; font-size:12.5px; padding:6px 10px; display:flex; justify-content:space-between;}
  .ov-card table{width:100%; border-collapse:collapse; font-size:11.5px;}
  .ov-card td{padding:5px 8px; border-bottom:1px solid var(--border);}
  .ov-card tr:last-child td{border-bottom:none;}
  .ov-card td.n{text-align:center; width:20px; color:var(--text-dim);}
  .ov-card td.p{text-align:right; font-weight:700; width:26px;}
  .ov-card tr.top td{background:var(--accent-dim);}

  .empty{text-align:center; color:var(--text-dim); font-size:13px; padding:30px 0;}
  .toast{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--danger); color:#fff; padding:8px 16px; border-radius:8px; font-size:12.5px; display:none;}

  .ko-confrontos{display:flex; flex-direction:column; gap:16px;}
  .ko-confronto{background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .ko-confronto-head{display:flex; align-items:center; gap:10px; padding:10px 14px; background:linear-gradient(135deg, var(--accent-dim), var(--bg-elev-2)); border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .ko-confronto-head .num{font-size:10.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:#fff; background:var(--accent); border-radius:999px; padding:3px 10px; flex:0 0 auto;}
  .ko-confronto-head .vs-groups{font-size:14px; font-weight:700; color:var(--text);}
  .ko-confronto-body{display:flex; flex-direction:column;}
  .ko-confronto-body .ko-match + .ko-match{border-top:1px dashed var(--border);}
  .ko-match{padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
  .ko-tag{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; border-radius:6px; padding:2px 7px; display:inline-block; align-self:flex-start;}
  .ko-tag.pending{color:var(--text-dim); background:var(--bg-elev-2);}
  .ko-tag.live{color:var(--warn); background:var(--warn-dim);}
  .ko-tag.done{color:var(--accent); background:var(--accent-dim);}
  .ko-players-row{display:flex; align-items:center; gap:10px;}
  .ko-p{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; color:var(--text-dim); min-width:0; flex:1 1 0;}
  .ko-p.right{flex-direction:row-reverse; justify-content:flex-start; text-align:right;}
  .ko-p-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ko-p-badge{font-size:10px; color:var(--text-dim); font-weight:700; background:var(--bg-elev-2); border-radius:6px; padding:1px 6px; flex:0 0 auto;}
  .ko-p.winner{color:var(--text);}
  .ko-p.winner .ko-p-name{font-weight:800;}
  .ko-p.winner .ko-p-badge{color:var(--accent); background:var(--accent-dim);}
  .ko-vs-mid{font-size:10.5px; color:var(--text-dim); font-weight:700; flex:0 0 auto; text-transform:uppercase; letter-spacing:.03em;}
  .ko-match-bottom{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .ko-sets{font-size:11px; color:var(--text-dim); font-weight:600; flex:0 0 auto; white-space:nowrap;}
  .ko-sets-empty{font-style:italic; opacity:.7;}
  .ko-score-mid{flex:0 0 auto; font-size:17px; font-weight:800; color:var(--text); background:var(--bg-elev-2); border:1px solid var(--border); border-radius:10px; padding:4px 12px; letter-spacing:.02em; white-space:nowrap;}
  .ko-players-row.clickable{cursor:pointer; border-radius:10px;}
  .ko-players-row.clickable:hover .ko-score-mid{border-color:var(--accent);}
  .ko-games{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; background:var(--bg-elev-2); border:1px dashed var(--border); border-radius:10px; padding:8px;}
  .ko-game-chip{display:flex; flex-direction:column; align-items:center; min-width:74px; padding:4px 10px; border-radius:8px; background:var(--bg-elev); border:1px solid var(--border);}
  .ko-game-chip .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-dim); font-weight:700;}
  .ko-game-chip .val{font-size:15px; font-weight:800; color:var(--text);}
  .ko-game-chip.tb .val{color:var(--warn);}
  .modal-sets{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .modal-set-row{display:flex; align-items:center; gap:10px;}
  .modal-set-row .set-label{font-size:11.5px; color:var(--text-dim); width:84px; flex:0 0 auto;}
  .modal-set-row .modal-score{width:54px; font-size:17px;}
  .draw-box{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; background:linear-gradient(135deg, var(--accent-dim), var(--bg-elev-2)); border:1px solid var(--border); border-radius:14px; padding:28px 16px;}
  .draw-title{font-size:17px; font-weight:800; color:var(--text);}
  .draw-sub{font-size:12.5px; color:var(--text-dim);}
  .draw-btn{margin-top:6px; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:12px 26px; font-size:15px; font-weight:800; cursor:pointer;}
  .draw-btn:disabled{opacity:.45; cursor:not-allowed;}
  .draw-redo{display:flex; justify-content:center; margin-top:14px;}
  .ko-note{font-size:11px; color:var(--text-dim); margin:-2px 0 2px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
  var ROUNDS = [[1,4],[2,3],[1,3],[2,4],[1,2],[3,4]];
  var state = { groups: {}, order: [], selected: null, tab: "mata-mata", loaded: false, modal: null, knockout: [], oitavas: null, koModal: null, koOpen: {}, tabSet: false, drawing: false };

  function openModal(groupId, idx){
    state.modal = { groupId: groupId, idx: idx };
    render();
  }
  function closeModal(){
    state.modal = null;
    render();
  }
  function koList(round){
    return round === "oitavas" ? (state.oitavas || []) : (state.knockout || []);
  }
  function openKoModal(idx, round){
    state.koModal = { idx: idx, round: round || "ko" };
    render();
  }
  function closeKoModal(){
    state.koModal = null;
    render();
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === "class") e.className = attrs[k];
      else if(k === "html") e.innerHTML = attrs[k];
      else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function txt(s){ return document.createTextNode(s); }
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(function(){ t.style.display = "none"; }, 3000);
  }

  function matchPoints(a, b){
    if(a === null || a === undefined || b === null || b === undefined) return [null,null];
    if(a === b) return [0,0];
    var hi = Math.max(a,b), lo = Math.min(a,b);
    var tb = (hi === 7 && lo === 6);
    if(a > b) return tb ? [2,1] : [3,0];
    return tb ? [1,2] : [0,3];
  }
  function isTieBreak(a,b){
    if(a===null||b===null||a===undefined||b===undefined) return false;
    var hi=Math.max(a,b), lo=Math.min(a,b);
    return hi===7 && lo===6;
  }

  // ---- Fase eliminatória (mata-mata): 2 sets, com tie-break de 10 pontos
  // (diferença mínima de 2) decidindo o jogo se ficar 1x1 nos sets.
  function koSetsWon(m){
    var a = 0, b = 0;
    (m.sets||[]).forEach(function(s){
      if(s.a===null || s.a===undefined || s.b===null || s.b===undefined) return;
      if(s.a > s.b) a++; else if(s.b > s.a) b++;
    });
    return [a,b];
  }
  function koStatus(m){
    var played = (m.sets||[]).filter(function(s){ return s.a!==null && s.a!==undefined && s.b!==null && s.b!==undefined; }).length;
    if(played===0) return "pending";
    if(koWinner(m)) return "done";
    return "live";
  }
  function koWinner(m){
    var w = koSetsWon(m);
    if(w[0]>=2) return "A";
    if(w[1]>=2) return "B";
    if(w[0]===1 && w[1]===1 && m.tiebreak && m.tiebreak.a!==null && m.tiebreak.b!==null && m.tiebreak.a!==undefined && m.tiebreak.b!==undefined){
      if(m.tiebreak.a > m.tiebreak.b) return "A";
      if(m.tiebreak.b > m.tiebreak.a) return "B";
    }
    return null;
  }
  function koAllDone(){
    return !!(state.knockout && state.knockout.length) && state.knockout.every(function(m){ return !!koWinner(m); });
  }
  function koNeedsTiebreak(m){
    var w = koSetsWon(m);
    return w[0]===1 && w[1]===1;
  }

  function standingsFor(group){
    var table = {};
    [1,2,3,4].forEach(function(p){
      table[p] = { pos:p, name:(group.players && group.players[p]) || ("Jogador "+p), J:0,V:0,D:0,Pts:0,GF:0,GA:0 };
    });
    (group.matches||[]).forEach(function(m){
      if(m.cancelled) return;
      if(m.scoreA===null || m.scoreA===undefined || m.scoreB===null || m.scoreB===undefined) return;
      var pa = table[m.posA], pb = table[m.posB];
      pa.GF += m.scoreA; pa.GA += m.scoreB;
      pb.GF += m.scoreB; pb.GA += m.scoreA;
      pa.J += 1; pb.J += 1;
      var pts = matchPoints(m.scoreA, m.scoreB);
      pa.Pts += pts[0]; pb.Pts += pts[1];
      if(m.scoreA > m.scoreB){ pa.V+=1; pb.D+=1; } else { pb.V+=1; pa.D+=1; }
    });
    var arr = [1,2,3,4].map(function(p){ return table[p]; });
    arr.forEach(function(r){ r.Saldo = r.GF - r.GA; });
    arr.sort(function(x,y){
      if(y.Pts !== x.Pts) return y.Pts - x.Pts;
      if(y.Saldo !== x.Saldo) return y.Saldo - x.Saldo;
      return y.GF - x.GF;
    });
    return arr;
  }

  function groupStatus(group){
    var resolved = resolvedCount(group);
    if(resolved === 0) return "gray";
    if(resolved === 6) return "green";
    return "yellow";
  }
  function resolvedCount(group){
    var n=0;
    (group.matches||[]).forEach(function(m){ if(m.cancelled || (m.scoreA!==null && m.scoreA!==undefined)) n++; });
    return n;
  }

  function apiGet(){
    return fetch("/api/groups").then(function(r){ return r.json(); });
  }
  function apiSave(groupId, idx, scoreA, scoreB, cancelled, reset){
    return fetch("/api/groups/" + groupId + "/matches/" + idx, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ scoreA: scoreA, scoreB: scoreB, cancelled: !!cancelled, reset: !!reset })
    }).then(function(r){
      if(!r.ok) return r.json().then(function(e){ throw new Error(e.error || "erro ao salvar"); });
      return r.json();
    });
  }
  function apiSaveKnockout(idx, sets, tiebreak, reset, round){
    return fetch((round === "oitavas" ? "/api/oitavas/matches/" : "/api/knockout/matches/") + idx, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ sets: sets, tiebreak: tiebreak, reset: !!reset })
    }).then(function(r){
      if(!r.ok) return r.json().then(function(e){ throw new Error(e.error || "erro ao salvar"); });
      return r.json();
    });
  }

  function loadData(){
    return apiGet().then(function(data){
      state.groups = {};
      state.order = [];
      (data.groups||[]).forEach(function(g){
        var id = String(g.number);
        state.groups[id] = g;
        state.order.push(id);
      });
      state.order.sort(function(a,b){ return parseInt(a,10) - parseInt(b,10); });
      if(state.selected === null && state.order.length) state.selected = state.order[0];
      state.knockout = data.knockout || [];
      state.oitavas = (data.oitavas && data.oitavas.length) ? data.oitavas : null;
      if(!state.tabSet){
        state.tabSet = true;
        state.tab = (state.oitavas || koAllDone()) ? "oitavas" : "mata-mata";
      }
      state.loaded = true;
      // não redesenha enquanto um popup de lançamento está aberto (senão apaga o que está sendo digitado)
      if(state.modal || state.koModal) return;
      render();
    }).catch(function(e){
      console.error(e);
      state.loaded = true;
      render();
    });
  }

  function saveMatch(groupId, idx, scoreA, scoreB, cancelled, reset){
    apiSave(groupId, idx, scoreA, scoreB, cancelled, reset).then(function(resp){
      state.groups[groupId] = resp.group;
      state.modal = null;
      render();
    }).catch(function(e){
      showToast(e.message || "Erro ao salvar resultado");
    });
  }
  function saveKnockout(idx, sets, tiebreak, reset){
    var round = state.koModal && state.koModal.round ? state.koModal.round : "ko";
    apiSaveKnockout(idx, sets, tiebreak, reset, round).then(function(resp){
      koList(round)[idx] = resp.match;
      state.koModal = null;
      render();
    }).catch(function(e){
      showToast(e.message || "Erro ao salvar resultado");
    });
  }

  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";

    var totalMatches = state.order.length * 6;
    var doneMatches = 0;
    state.order.forEach(function(id){ doneMatches += resolvedCount(state.groups[id]); });

    var head = el("header", {class:"top"}, [
      el("div", {class:"emoji", html:"🎾"}),
      el("div", {}, [
        el("h1", {}, [txt("Champions League — Fase de Grupos")]),
        el("p", {}, [txt("16 grupos · 4 jogadores por grupo · todos jogam entre si")])
      ]),
      el("div", {class:"progress"}, [
        el("b", {}, [txt(doneMatches + " / " + totalMatches)]),
        el("br"),
        txt("jogos lançados")
      ])
    ]);
    app.appendChild(head);

    var tabs = el("nav", {class:"tabs"}, [
      el("button", {class: state.tab==="oitavas" ? "active":"", onclick:function(){ state.tab="oitavas"; render(); }}, [txt("Oitavas")]),
      el("button", {class: state.tab==="mata-mata" ? "active":"", onclick:function(){ state.tab="mata-mata"; render(); }}, [txt("Fase Eliminatória")]),
      el("button", {class: state.tab==="grupos" ? "active":"", onclick:function(){ state.tab="grupos"; render(); }}, [txt("Grupos")]),
      el("button", {class: state.tab==="visao" ? "active":"", onclick:function(){ state.tab="visao"; render(); }}, [txt("Visão Geral")])
    ]);
    app.appendChild(tabs);

    if(state.tab !== "mata-mata" && state.tab !== "oitavas") app.appendChild(el("div", {class:"rules-note"}, [txt(
      "Pontuação: vitória normal = 3 pts · vitória no tie-break (7x6) = 2 pts · derrota no tie-break = 1 pt · derrota normal = 0 pt. Qualquer pessoa com este link pode lançar ou editar um resultado."
    )]));

    if(!state.loaded){
      app.appendChild(el("div", {class:"empty"}, [txt("Carregando dados do campeonato...")]));
      return;
    }

    if(state.tab === "grupos"){
      renderGruposTab(app);
    } else if(state.tab === "oitavas"){
      renderOitavasTab(app);
    } else if(state.tab === "mata-mata"){
      renderKnockoutTab(app);
    } else {
      renderVisaoTab(app);
    }

    renderModal(app);
    renderKoModal(app);
  }

  function renderModal(app){
    if(!state.modal) return;
    var groupId = state.modal.groupId, idx = state.modal.idx;
    var group = state.groups[groupId];
    if(!group || !group.matches[idx]){ state.modal = null; return; }
    var m = group.matches[idx];
    var nameA = group.players[m.posA], nameB = group.players[m.posB];

    var overlay = el("div", {class:"modal-overlay", onclick:function(e){ if(e.target === overlay) closeModal(); }});
    var box = el("div", {class:"modal-box"});

    box.appendChild(el("div", {class:"modal-header"}, [
      el("h3", {}, [txt("Resultado do Jogo")]),
      el("button", {class:"modal-x", onclick:function(){ closeModal(); }}, [txt("×")])
    ]));

    box.appendChild(el("div", {class:"modal-players"}, [
      el("b", {}, [txt(nameA)]),
      el("span", {class:"vs"}, [txt("vs")]),
      el("b", {}, [txt(nameB)])
    ]));

    var inputA = el("input", {class:"modal-score", type:"number", min:"0", value: m.scoreA===null||m.scoreA===undefined?"":m.scoreA});
    var inputB = el("input", {class:"modal-score", type:"number", min:"0", value: m.scoreB===null||m.scoreB===undefined?"":m.scoreB});
    box.appendChild(el("div", {class:"modal-scores"}, [inputA, el("span",{class:"dash"},[txt("—")]), inputB]));

    var preview = el("div", {class:"modal-preview"});
    var saveBtn = el("button", {class:"btn-primary"}, [txt("Salvar")]);

    function refresh(){
      var a = inputA.value === "" ? null : parseInt(inputA.value, 10);
      var b = inputB.value === "" ? null : parseInt(inputB.value, 10);
      preview.innerHTML = "";
      var valid = (a!==null && b!==null && !isNaN(a) && !isNaN(b) && a>=0 && b>=0 && a!==b);
      if(valid){
        var pts = matchPoints(a,b);
        if(isTieBreak(a,b)) preview.appendChild(el("span",{class:"tb-tag"},[txt("TIE-BREAK ")]));
        preview.appendChild(el("span", {}, [txt(nameA+" → "+pts[0]+" pts | "+nameB+" → "+pts[1]+" pts")]));
      }
      saveBtn.disabled = !valid;
    }
    inputA.addEventListener("input", refresh);
    inputB.addEventListener("input", refresh);

    saveBtn.onclick = function(){
      var a = inputA.value === "" ? null : parseInt(inputA.value, 10);
      var b = inputB.value === "" ? null : parseInt(inputB.value, 10);
      if(a===null || b===null || isNaN(a) || isNaN(b) || a===b) return;
      saveMatch(groupId, idx, a, b, false, false);
    };

    box.appendChild(preview);

    var clearBtn = el("button", {class:"btn-secondary", onclick:function(){
      saveMatch(groupId, idx, null, null, false, true);
    }}, [txt("Limpar")]);
    var closeBtn = el("button", {class:"btn-secondary", onclick:function(){ closeModal(); }}, [txt("Fechar")]);
    box.appendChild(el("div", {class:"modal-actions"}, [clearBtn, closeBtn, saveBtn]));

    box.appendChild(el("button", {class:"modal-cancel-toggle", onclick:function(){
      if(m.cancelled){
        saveMatch(groupId, idx, null, null, false, true);
      } else {
        saveMatch(groupId, idx, null, null, true, false);
      }
    }}, [txt(m.cancelled ? "Reabrir jogo (desmarcar cancelamento)" : "Marcar jogo como cancelado")]));

    refresh();
    overlay.appendChild(box);
    app.appendChild(overlay);
  }

  function renderGruposTab(app){
    var chipGrid = el("div", {class:"chip-grid"});
    state.order.forEach(function(id){
      var g = state.groups[id];
      var status = groupStatus(g);
      var dotClass = status === "green" ? "dot-green" : (status === "yellow" ? "dot-yellow" : "dot-gray");
      var chip = el("div", {
        class: "chip" + (state.selected === id ? " sel" : ""),
        onclick: (function(gid){ return function(){ state.selected = gid; render(); }; })(id)
      }, [
        txt(id),
        el("span", {class:"dot " + dotClass})
      ]);
      chipGrid.appendChild(chip);
    });
    app.appendChild(chipGrid);

    app.appendChild(el("div", {class:"legend"}, [
      el("span", {}, [el("i", {style:"background:var(--accent)"}), txt("Completo")]),
      el("span", {}, [el("i", {style:"background:var(--warn)"}), txt("Em andamento")]),
      el("span", {}, [el("i", {style:"background:var(--chip-off)"}), txt("Sem jogos")])
    ]));

    var group = state.groups[state.selected];
    if(!group){
      app.appendChild(el("div", {class:"empty"}, [txt("Grupo sem dados ainda.")]));
      return;
    }

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, [
      txt("Grupo " + state.selected),
      el("span", {class:"sub"}, [txt(resolvedCount(group) + "/6 jogos")])
    ]));

    var table = el("table", {class:"standings"});
    var thead = el("tr", {}, [
      el("th", {}, [txt("#")]), el("th", {}, [txt("Jogador")]),
      el("th", {class:"num"}, [txt("J")]), el("th", {class:"num"}, [txt("V")]),
      el("th", {class:"num"}, [txt("D")]), el("th", {class:"num"}, [txt("Pts")]),
      el("th", {class:"num"}, [txt("Saldo")])
    ]);
    table.appendChild(thead);
    standingsFor(group).forEach(function(row, i){
      var tr = el("tr", {}, [
        el("td", {}, [el("span", {class:"pos-badge" + (i<2?" pos-"+(i+1):"")}, [txt(String(i+1))])]),
        el("td", {}, [txt(row.name)]),
        el("td", {class:"num"}, [txt(String(row.J))]),
        el("td", {class:"num"}, [txt(String(row.V))]),
        el("td", {class:"num"}, [txt(String(row.D))]),
        el("td", {class:"num"}, [txt(String(row.Pts))]),
        el("td", {class:"num"}, [txt((row.Saldo>0?"+":"")+row.Saldo)])
      ]);
      table.appendChild(tr);
    });
    card.appendChild(table);
    app.appendChild(card);

    var matchesCard = el("div", {class:"card"});
    matchesCard.appendChild(el("h2", {}, [txt("Jogos")]));
    (group.matches || []).forEach(function(m, idx){
      matchesCard.appendChild(renderMatchRow(state.selected, group, m, idx));
    });
    app.appendChild(matchesCard);
  }

  function renderMatchRow(groupId, group, m, idx){
    var nameA = group.players[m.posA], nameB = group.players[m.posB];
    var played = !m.cancelled && m.scoreA !== null && m.scoreA !== undefined;
    var aWin = played && m.scoreA > m.scoreB;
    var bWin = played && m.scoreB > m.scoreA;

    var row = el("div", {class:"match-row"});

    var summary = el("div", {class:"match-summary"}, [
      el("span", {class:"name" + (aWin?" win":"")}, [txt(nameA)])
    ]);
    if(m.cancelled){
      summary.appendChild(el("span", {class:"cancel-tag"}, [txt("CANCELADO")]));
    } else if(played){
      summary.appendChild(el("span", {class:"score-pair"}, [txt(m.scoreA + " – " + m.scoreB)]));
      if(isTieBreak(m.scoreA, m.scoreB)) summary.appendChild(el("span", {class:"tb-tag"}, [txt("TIE-BREAK")]));
    } else {
      summary.appendChild(el("span", {class:"vs-tag"}, [txt("vs")]));
    }
    summary.appendChild(el("span", {class:"name" + (bWin?" win":"")}, [txt(nameB)]));
    row.appendChild(summary);

    var right = el("div", {class:"match-right"});
    if(played){
      var pts = matchPoints(m.scoreA, m.scoreB);
      right.appendChild(el("span", {class:"pts-preview"}, [txt(pts[0]+"pt | "+pts[1]+"pt")]));
    }
    right.appendChild(el("button", {class:"edit-btn", onclick:function(){ openModal(groupId, idx); }}, [
      txt(m.cancelled || played ? "Editar" : "Lançar resultado")
    ]));
    row.appendChild(right);

    return row;
  }

  function renderVisaoTab(app){
    var grid = el("div", {class:"overview-grid"});
    state.order.forEach(function(id){
      var g = state.groups[id];
      if(!g) return;
      var card = el("div", {class:"ov-card"});
      card.appendChild(el("div", {class:"hd"}, [txt("Grupo "+id), txt(resolvedCount(g)+"/6")]));
      var table = el("table");
      standingsFor(g).forEach(function(row, i){
        var tr = el("tr", {class: i<2 ? "top":""}, [
          el("td", {class:"n"}, [txt(String(i+1))]),
          el("td", {}, [txt(row.name)]),
          el("td", {style:"text-align:center;color:var(--text-dim);font-size:10.5px;"}, [txt(row.V+"V "+row.D+"D")]),
          el("td", {class:"p"}, [txt(String(row.Pts))])
        ]);
        table.appendChild(tr);
      });
      card.appendChild(table);
      grid.appendChild(card);
    });
    app.appendChild(grid);
  }

  function renderKoMatchCard(m, idx, round){
    round = round || "ko";
    var openKey = round + ":" + idx;
    var status = koStatus(m);
    var winner = koWinner(m);
    var w = koSetsWon(m);

    var tagClass = status === "done" ? "done" : (status === "live" ? "live" : "pending");
    var tagText = status === "done" ? "Finalizado" : (status === "live" ? "Em andamento" : "Não iniciado");

    var mcard = el("div", {class:"ko-match"});
    mcard.appendChild(el("span", {class:"ko-tag " + tagClass}, [txt(tagText)]));

    var hasResult = status !== "pending";
    var isOpen = !!(state.koOpen && state.koOpen[openKey]);

    var midNode = hasResult
      ? el("span", {class:"ko-score-mid"}, [txt((w[0] + (winner==="A" && w[0]===w[1] ? 1 : 0)) + " x " + (w[1] + (winner==="B" && w[0]===w[1] ? 1 : 0)))])
      : el("span", {class:"ko-vs-mid"}, [txt("vs")]);

    var prow = el("div", {class:"ko-players-row" + (hasResult ? " clickable" : "")}, [
      el("div", {class:"ko-p" + (winner==="A"?" winner":"")}, [
        el("span", {class:"ko-p-name"}, [txt(m.playerA)]),
        el("span", {class:"ko-p-badge"}, [txt("G" + m.groupA + " · " + m.posA + "º")])
      ]),
      midNode,
      el("div", {class:"ko-p right" + (winner==="B"?" winner":"")}, [
        el("span", {class:"ko-p-name"}, [txt(m.playerB)]),
        el("span", {class:"ko-p-badge"}, [txt("G" + m.groupB + " · " + m.posB + "º")])
      ])
    ]);
    if(hasResult){
      prow.addEventListener("click", function(){
        state.koOpen = state.koOpen || {};
        state.koOpen[openKey] = !state.koOpen[openKey];
        render();
      });
    }
    mcard.appendChild(prow);

    if(hasResult && isOpen){
      var chips = el("div", {class:"ko-games"});
      (m.sets||[]).forEach(function(s, i){
        if(s.a===null || s.a===undefined || s.b===null || s.b===undefined) return;
        chips.appendChild(el("div", {class:"ko-game-chip"}, [
          el("span", {class:"lbl"}, [txt("Set " + (i+1))]),
          el("span", {class:"val"}, [txt(s.a + " x " + s.b)])
        ]));
      });
      if(m.tiebreak && m.tiebreak.a!==null && m.tiebreak.a!==undefined){
        chips.appendChild(el("div", {class:"ko-game-chip tb"}, [
          el("span", {class:"lbl"}, [txt("Tie-break")]),
          el("span", {class:"val"}, [txt(m.tiebreak.a + " x " + m.tiebreak.b)])
        ]));
      }
      mcard.appendChild(chips);
    }

    var bottom = el("div", {class:"ko-match-bottom"});
    if(hasResult){
      bottom.appendChild(el("div", {class:"ko-sets"}, [txt(isOpen ? "▲ ocultar games" : "▼ toque no jogo para ver os games")]));
    } else {
      bottom.appendChild(el("div", {class:"ko-sets ko-sets-empty"}, [txt("Resultado pendente")]));
    }
    bottom.appendChild(el("button", {class:"edit-btn", onclick:(function(i){ return function(){ openKoModal(i, round); }; })(idx)}, [
      txt(status === "pending" ? "Lançar resultado" : "Editar")
    ]));
    mcard.appendChild(bottom);

    return mcard;
  }

  function drawOitavas(){
    if(state.drawing) return;
    state.drawing = true;
    render();
    fetch("/api/oitavas/draw", { method: "POST", headers: {"Content-Type":"application/json"}, body: "{}" })
      .then(function(r){
        return r.json().then(function(j){
          if(!r.ok) throw new Error(j.error || "erro ao sortear");
          return j;
        });
      })
      .then(function(j){
        state.oitavas = j.oitavas;
        state.koOpen = {};
        state.drawing = false;
        render();
      })
      .catch(function(e){
        state.drawing = false;
        showToast(e.message || "Erro ao sortear");
        render();
      });
  }

  function renderOitavasTab(app){
    app.appendChild(el("div", {class:"rules-note"}, [txt(
      "Oitavas de final: os 16 vencedores da fase eliminatória são sorteados em 8 jogos. Jogadores que eram do mesmo grupo na fase de grupos não se enfrentam (só poderiam se reencontrar na final). Cada jogo vale 2 sets; se ficar 1x1, decide no tie-break de 10 pontos (vencer por 2 de diferença — 10x8, 12x10, 14x12 e assim por diante)."
    )]));

    if(!state.oitavas){
      var done = (state.knockout || []).filter(function(m){ return !!koWinner(m); }).length;
      var total = (state.knockout || []).length;
      var ready = total > 0 && done === total;
      var box = el("div", {class:"draw-box"}, [
        el("div", {class:"draw-title"}, [txt(ready ? "Tudo pronto para o sorteio!" : "Aguardando o fim da fase eliminatória")]),
        el("div", {class:"draw-sub"}, [txt(done + " de " + total + " jogos da fase eliminatória finalizados" + (ready ? "" : " — o sorteio libera quando todos tiverem resultado."))])
      ]);
      var btn = el("button", {class:"draw-btn", onclick:drawOitavas}, [txt(state.drawing ? "Sorteando..." : "🎲 Sortear oitavas")]);
      if(!ready || state.drawing) btn.disabled = true;
      box.appendChild(btn);
      app.appendChild(box);
      return;
    }

    var wrap = el("div", {class:"ko-confrontos"});
    state.oitavas.forEach(function(m, i){
      var section = el("div", {class:"ko-confronto"});
      section.appendChild(el("div", {class:"ko-confronto-head"}, [
        el("span", {class:"num"}, [txt("Oitava " + (i+1))]),
        el("span", {class:"vs-groups"}, [txt("Grupo " + m.groupA + " × Grupo " + m.groupB)])
      ]));
      section.appendChild(el("div", {class:"ko-confronto-body"}, [renderKoMatchCard(m, i, "oitavas")]));
      wrap.appendChild(section);
    });
    app.appendChild(wrap);

    var anyResult = state.oitavas.some(function(m){ return koStatus(m) !== "pending"; });
    if(!anyResult){
      app.appendChild(el("div", {class:"draw-redo"}, [
        el("button", {class:"btn-secondary", onclick:function(){
          if(window.confirm("Refazer o sorteio das oitavas? O sorteio atual será descartado.")) drawOitavas();
        }}, [txt("🎲 Refazer sorteio")])
      ]));
    }
  }

  function renderKnockoutTab(app){
    app.appendChild(el("div", {class:"rules-note"}, [txt(
      "Fase eliminatória: cada confronto vale 2 sets. Se ficar 1x1 nos sets, decide no tie-break de 10 pontos (precisa vencer por 2 de diferença — 10x8, 11x9, e assim por diante). Quem ganha avança de fase."
    )]));

    if(!state.knockout || !state.knockout.length){
      app.appendChild(el("div", {class:"empty"}, [txt("Fase eliminatória ainda não disponível.")]));
      return;
    }

    var wrap = el("div", {class:"ko-confrontos"});

    for(var i = 0; i < state.knockout.length; i += 2){
      var m1 = state.knockout[i];
      var m2 = state.knockout[i+1];
      var confrontoNum = (i/2) + 1;

      var section = el("div", {class:"ko-confronto"});

      var head = el("div", {class:"ko-confronto-head"}, [
        el("span", {class:"num"}, [txt("Confronto " + confrontoNum)]),
        el("span", {class:"vs-groups"}, [txt("Grupo " + m1.groupA + " × Grupo " + m1.groupB)])
      ]);
      section.appendChild(head);

      var body = el("div", {class:"ko-confronto-body"});
      body.appendChild(renderKoMatchCard(m1, i));
      if(m2){ body.appendChild(renderKoMatchCard(m2, i+1)); }
      section.appendChild(body);

      wrap.appendChild(section);
    }

    app.appendChild(wrap);
  }

  function renderKoModal(app){
    if(!state.koModal) return;
    var idx = state.koModal.idx;
    var round = state.koModal.round || "ko";
    var m = koList(round)[idx];
    if(!m){ state.koModal = null; return; }

    var overlay = el("div", {class:"modal-overlay", onclick:function(e){ if(e.target === overlay) closeKoModal(); }});
    var box = el("div", {class:"modal-box"});

    box.appendChild(el("div", {class:"modal-header"}, [
      el("h3", {}, [txt(round === "oitavas" ? "Resultado — Oitavas" : "Resultado — Mata-mata")]),
      el("button", {class:"modal-x", onclick:function(){ closeKoModal(); }}, [txt("×")])
    ]));

    box.appendChild(el("div", {class:"modal-players"}, [
      el("b", {}, [txt(m.playerA)]),
      el("span", {class:"vs"}, [txt("vs")]),
      el("b", {}, [txt(m.playerB)])
    ]));

    var sets = el("div", {class:"modal-sets"});

    function setRow(label, s){
      var inA = el("input", {class:"modal-score", type:"number", min:"0", value: s.a===null||s.a===undefined?"":s.a});
      var inB = el("input", {class:"modal-score", type:"number", min:"0", value: s.b===null||s.b===undefined?"":s.b});
      var r = el("div", {class:"modal-set-row"}, [
        el("span", {class:"set-label"}, [txt(label)]),
        inA, el("span",{class:"dash"},[txt("—")]), inB
      ]);
      return { row:r, inA:inA, inB:inB };
    }

    var set1 = setRow("Set 1", m.sets && m.sets[0] ? m.sets[0] : {a:null,b:null});
    var set2 = setRow("Set 2", m.sets && m.sets[1] ? m.sets[1] : {a:null,b:null});
    sets.appendChild(set1.row);
    sets.appendChild(set2.row);

    var tbWrap = el("div", {});
    var tbNote = el("div", {class:"ko-note"}, [txt("Tie-break (só preencher se ficar 1x1 nos sets — mínimo 10 pontos, vencer por 2)")]);
    var tb = setRow("Tie-break", m.tiebreak || {a:null,b:null});
    tbWrap.appendChild(tbNote);
    tbWrap.appendChild(tb.row);
    sets.appendChild(tbWrap);

    box.appendChild(sets);

    var preview = el("div", {class:"modal-preview"});
    var saveBtn = el("button", {class:"btn-primary"}, [txt("Salvar")]);

    function currentSets(){
      var a0 = set1.inA.value===""?null:parseInt(set1.inA.value,10);
      var b0 = set1.inB.value===""?null:parseInt(set1.inB.value,10);
      var a1 = set2.inA.value===""?null:parseInt(set2.inA.value,10);
      var b1 = set2.inB.value===""?null:parseInt(set2.inB.value,10);
      return [{a:a0,b:b0},{a:a1,b:b1}];
    }
    function currentTiebreak(){
      var ta = tb.inA.value===""?null:parseInt(tb.inA.value,10);
      var tbv = tb.inB.value===""?null:parseInt(tb.inB.value,10);
      return {a:ta, b:tbv};
    }
    function setValid(s){
      return s.a!==null && s.b!==null && !isNaN(s.a) && !isNaN(s.b) && s.a>=0 && s.b>=0 && s.a!==s.b;
    }
    function tbValid(t){
      if(t.a===null || t.b===null || isNaN(t.a) || isNaN(t.b)) return false;
      if(t.a<0 || t.b<0 || t.a===t.b) return false;
      return Math.max(t.a,t.b)>=10 && Math.abs(t.a-t.b)>=2;
    }

    function refresh(){
      var s = currentSets();
      var t = currentTiebreak();
      preview.innerHTML = "";
      var s0ok = setValid(s[0]), s1ok = setValid(s[1]);
      var valid = s0ok && s1ok;
      var wA = (s0ok && s[0].a>s[0].b?1:0) + (s1ok && s[1].a>s[1].b?1:0);
      var wB = (s0ok && s[0].b>s[0].a?1:0) + (s1ok && s[1].b>s[1].a?1:0);
      var needsTb = valid && wA===1 && wB===1;
      if(needsTb){
        valid = tbValid(t);
      }
      if(s0ok && s1ok){
        var txtMsg = m.playerA + " " + wA + " x " + wB + " " + m.playerB;
        if(needsTb){
          txtMsg += tbValid(t) ? (" | Tie-break: " + t.a + "-" + t.b) : " | falta o tie-break";
        }
        preview.appendChild(el("span", {}, [txt(txtMsg)]));
      }
      saveBtn.disabled = !valid;
    }
    [set1.inA,set1.inB,set2.inA,set2.inB,tb.inA,tb.inB].forEach(function(inp){
      inp.addEventListener("input", refresh);
    });

    saveBtn.onclick = function(){
      var s = currentSets();
      var t = currentTiebreak();
      if(!setValid(s[0]) || !setValid(s[1])) return;
      var wA = (s[0].a>s[0].b?1:0) + (s[1].a>s[1].b?1:0);
      var wB = (s[0].b>s[0].a?1:0) + (s[1].b>s[1].a?1:0);
      var needsTb = wA===1 && wB===1;
      if(needsTb && !tbValid(t)) return;
      saveKnockout(idx, s, needsTb ? t : {a:null,b:null}, false);
    };

    box.appendChild(preview);

    var clearBtn = el("button", {class:"btn-secondary", onclick:function(){
      saveKnockout(idx, null, null, true);
    }}, [txt("Limpar")]);
    var closeBtn = el("button", {class:"btn-secondary", onclick:function(){ closeKoModal(); }}, [txt("Fechar")]);
    box.appendChild(el("div", {class:"modal-actions"}, [clearBtn, closeBtn, saveBtn]));

    refresh();
    overlay.appendChild(box);
    app.appendChild(overlay);
  }

  render();
  loadData();
  // atualização periódica pra quem entra depois já ver o resultado mais recente
  setInterval(loadData, 8000);
})();
